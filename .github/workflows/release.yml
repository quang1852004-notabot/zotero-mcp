name: Test and build Zotero MCP

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    tags:
    - '*'
    branches:
    - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # PDF text extraction is a compiled dependency shipping per-platform
        # abi3 wheels, so Linux alone cannot tell us the package installs and
        # parses correctly everywhere. One job per other OS is enough to catch
        # a missing wheel or a platform-specific extraction failure.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout "fastmcp<4" pyzotero python-dotenv "pdf-inspector==0.2.6" markdownify chromadb unidecode bibtexparser tiktoken pymupdf
          python -m pip install -e . --no-deps
      - name: Run tests
        run: pytest --ignore=tests/test_lifespan.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - name: Build the Zotero Agent plugin
        run: |
          npm ci
          npm run build
          mkdir -p ../src/zotero_mcp/chat_plugin
          cp dist/zotero-agent.xpi ../src/zotero_mcp/chat_plugin/
        working-directory: plugin
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      # Not in dist/: the PyPI upload step takes everything there.
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: plugin/dist/zotero-agent.xpi

  github-release:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xpi
      - name: Attach the plugin to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" zotero-agent.xpi --clobber

